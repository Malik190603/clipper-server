<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clipper Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: aplikasi studio — sidebar navigasi | area kerja; editor = inspektur | pratinjau, timeline di bawah */
:root{
  --bg:#0e1014; --panel:#16191f; --panel2:#1c2027; --sunk:#111318; --ink:#e9ebef; --muted:#9ba2ae; --faint:#69707c;
  --line:#262a32; --line2:#323743;
  --accent:#ffbf1a; --accent-ink:#1d1500; --accent-soft:rgba(255,191,26,.12);
  --t-sub:#38bdf8; --t-emoji:#f472b6; --t-zoom:#a78bfa; --t-cam:#34d399; --t-video:#3a4150; --t-intro:#f59e0b;
  --tally:#ff5a4f; --ok:#3fcf80; --ok-soft:rgba(63,207,128,.12); --err-soft:rgba(255,90,79,.12);
  --stage:#07080a;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f2f3f5; --panel:#ffffff; --panel2:#f6f7f9; --sunk:#eceef1; --ink:#15181d; --muted:#5d6470; --faint:#8a909b;
  --line:#e1e4e9; --line2:#cfd3da; --accent:#f0a500; --accent-ink:#1d1500; --accent-soft:rgba(240,165,0,.14);
  --t-video:#c9ced8; --ok:#16834a; --tally:#d93a2f; --stage:#1a1d22; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f2f3f5; --panel:#ffffff; --panel2:#f6f7f9; --sunk:#eceef1; --ink:#15181d; --muted:#5d6470; --faint:#8a909b;
  --line:#e1e4e9; --line2:#cfd3da; --accent:#f0a500; --accent-ink:#1d1500; --accent-soft:rgba(240,165,0,.14);
  --t-video:#c9ced8; --ok:#16834a; --tally:#d93a2f; --stage:#1a1d22; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Kerangka aplikasi ---------- */
.app{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2b2f38,#16181d);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.mark i{width:10px;height:10px;border-radius:50%;background:var(--tally);box-shadow:0 0 0 3px rgba(255,90,79,.3)}
.busy .mark i{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.brand b{font:800 17px/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font:500 11px var(--f-body);color:var(--faint);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px}
.nav a:hover{background:var(--panel2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav .count{margin-left:auto;font:600 11px var(--f-mono);color:var(--faint)}
.side-sec{margin-top:18px;padding:0 10px;font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.side-tasks{margin-top:8px;display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0;flex:1}
.side-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.main{min-width:0;min-height:0;overflow:auto;position:relative}
.page{max-width:1280px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 48px 24px;display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h h1{font:800 26px/1.1 var(--f-display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.page-h p{margin:4px 0 0;color:var(--muted)}
.page-h .grow{flex:1;min-width:200px}
.tabbar{display:none}

/* ---------- Komponen ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font:700 14px var(--f-body);margin:0}
.card-h .meta{margin-left:auto;color:var(--faint);font-size:12px}
.card-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.btn{border:0;border-radius:9px;padding:9px 14px;font:700 13.5px var(--f-body);cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;white-space:nowrap;transition:filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line2)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid transparent}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--tally);border:1px solid color-mix(in srgb,var(--tally) 40%,transparent)}
.btn.danger.armed{background:var(--tally);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.icon{padding:7px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lg{padding:12px 18px;font-size:14.5px;border-radius:10px}
label.lbl{font:600 12px var(--f-body);color:var(--muted);display:block;margin-bottom:6px}
.field{display:flex;flex-direction:column}
input[type=text],input[type=password],input[type=number],input[type=url],select,textarea{
  width:100%;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:500 14px var(--f-body);min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:70px}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{border:1px solid var(--line2);background:var(--sunk);border-radius:99px;padding:6px 12px;font:600 12.5px var(--f-body);color:var(--muted)}
.chip input:checked + span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.switch{display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer;font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch span{flex:1}
.switch input{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(14px)}
.hint{margin:0;color:var(--muted);font-size:12.5px}
.status{font-size:13px;color:var(--muted)}
.status:empty{display:none}
.status.err{color:var(--tally);background:var(--err-soft);border-radius:8px;padding:8px 10px}
.status.ok{color:var(--ok);background:var(--ok-soft);border-radius:8px;padding:8px 10px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--f-body);border-radius:99px;padding:3px 8px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.pill.warn{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.pill.err{color:var(--tally);border-color:color-mix(in srgb,var(--tally) 35%,transparent)}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* ---------- Beranda ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:14px 16px}
.stat small{display:block;color:var(--faint);font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.stat b{display:block;font:800 28px/1.15 var(--f-display);margin-top:6px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.proj{overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.proj:hover{border-color:var(--line2)}
.proj .cover{aspect-ratio:16/9;background:#000 center/cover no-repeat;position:relative}
.proj .cover .pill{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;border-color:transparent}
.proj .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.proj h3{margin:0;font:700 14px/1.35 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.proj .row{display:flex;align-items:center;gap:4px 6px;color:var(--faint);font-size:12px;margin-top:auto;flex-wrap:wrap}
.proj .row span{white-space:nowrap}
.proj .row .btn{margin-left:auto}
.checklist{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:10px;align-items:center;font-size:13px}
.check i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none}
.check.done i{background:var(--ok);border-color:var(--ok)}
.task{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.task-top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;min-width:0}
.task-top span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .msg{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.prog{height:4px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.task.done .prog i{background:var(--ok)} .task.err .prog i{background:var(--tally)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.task.done .dot{background:var(--ok)} .task.err .dot{background:var(--tally)}
.task.run .dot{animation:blink 1s steps(2) infinite}

/* ---------- Proyek baru ---------- */
.new-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.url-row{display:flex;gap:10px}
.url-row input{font-size:15px;padding:12px 14px}

/* ---------- Halaman proyek ---------- */
.clip-list{display:flex;flex-direction:column;gap:8px}
.cliprow{display:grid;grid-template-columns:auto 72px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px}
.cliprow input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);margin:0}
.cliprow .mini{width:72px;aspect-ratio:9/16;border-radius:7px;background:var(--stage) center/cover;overflow:hidden}
.cliprow .mini canvas{width:100%;height:100%;display:block}
.cliprow h3{margin:0;font:700 14px/1.35 var(--f-body)}
.cliprow .sub{color:var(--muted);font-size:12.5px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cliprow .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.score{font:800 22px/1 var(--f-display);text-align:center;min-width:44px;font-variant-numeric:tabular-nums}
.score small{display:block;font:600 9px var(--f-body);color:var(--faint);letter-spacing:.08em;margin-top:3px}
.score.hi{color:var(--ok)} .score.mid{color:var(--accent)} .score.lo{color:var(--faint)}
.row-actions{display:flex;gap:6px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- Pustaka ekspor ---------- */
.exports{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.exp{overflow:hidden;display:flex;flex-direction:column}
.exp .v{aspect-ratio:9/16;background:#000;position:relative}
.exp .v img,.exp .v video{width:100%;height:100%;object-fit:cover;display:block}
.exp .v .pill{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.7);color:#fff;border-color:transparent}
.exp .body{padding:10px;display:flex;flex-direction:column;gap:8px}
.exp h3{margin:0;font:700 13px/1.35 var(--f-body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.exp .acts{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- Editor ---------- */
.editor{height:100%;display:grid;grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top" "insp stage" "tl tl";background:var(--bg)}
.ed-top{grid-area:top;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px 14px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.ed-top .t{min-width:0;flex:1}
.ed-top .t b{display:block;font:700 14px var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-top .t small{color:var(--faint);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insp{grid-area:insp;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.itabs{display:flex;flex-wrap:wrap;gap:2px;padding:8px;border-bottom:1px solid var(--line)}
.itabs button{border:0;background:transparent;color:var(--muted);font:600 12.5px var(--f-body);padding:7px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.itabs button[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.ipane{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
.ipane h4{margin:0;font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.sect{display:flex;flex-direction:column;gap:8px}
.cue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px;border-radius:9px;border:1px solid transparent}
.cue.sel{border-color:var(--t-sub);background:color-mix(in srgb,var(--t-sub) 10%,transparent)}
.cue .mono{font-size:11px;color:var(--muted);cursor:pointer}
.cue input{padding:6px 8px;font-size:13px}
.stage{grid-area:stage;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;min-height:0;min-width:0;background:radial-gradient(ellipse at center,var(--panel2),var(--bg) 70%)}
.screen{position:relative;height:100%;max-height:calc(100vh - 330px);aspect-ratio:9/16;max-width:100%;background:var(--stage);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line2),0 20px 50px -20px rgba(0,0,0,.6)}
.screen canvas{width:100%;height:100%;display:block}
.screen .over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#9aa1ad;padding:20px;font-size:13px;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.025) 10px 20px)}
.screen .over .btn{margin-top:10px}
.transport{display:flex;align-items:center;gap:10px;color:var(--muted)}
.transport .tc{font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.play svg{stroke:none;fill:currentColor}
.tl{grid-area:tl;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-width:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.tl-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tl-bar .sp{flex:1}
.tl-bar input[type=range]{width:110px;accent-color:var(--accent)}
.tl-body{display:grid;grid-template-columns:86px minmax(0,1fr);max-height:250px}
.tl-labels{border-right:1px solid var(--line);display:flex;flex-direction:column;padding-top:22px}
.tl-labels div{height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;font:600 11px var(--f-body);color:var(--muted)}
.tl-labels i{width:8px;height:8px;border-radius:2px;flex:none}
.tl-scroll{overflow-x:auto;overflow-y:hidden;position:relative;scrollbar-width:thin}
.tl-inner{position:relative;min-width:100%}
.ruler{height:22px;position:relative;border-bottom:1px solid var(--line);cursor:pointer}
.ruler span{position:absolute;top:4px;font:500 10px var(--f-mono);color:var(--faint);transform:translateX(3px)}
.ruler i{position:absolute;bottom:0;width:1px;height:6px;background:var(--line2)}
.track{height:34px;position:relative;border-bottom:1px solid var(--line)}
.blk{position:absolute;top:5px;height:24px;border-radius:6px;font:600 11px/24px var(--f-body);padding:0 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#0b0d10;cursor:grab;touch-action:none;user-select:none}
.blk.sel{box-shadow:0 0 0 2px var(--ink)}
.blk.video{background:var(--t-video);color:var(--ink);cursor:default;display:flex;align-items:center;gap:6px}
.blk.intro{background:var(--t-intro)}
.blk.sub{background:var(--t-sub)}
.mk{position:absolute;top:6px;width:22px;height:22px;margin-left:-11px;border-radius:6px;display:grid;place-items:center;font-size:13px;cursor:grab;touch-action:none;user-select:none;color:#0b0d10;font-weight:700}
.mk.emoji{background:color-mix(in srgb,var(--t-emoji) 30%,var(--panel))}
.mk.zoom{background:var(--t-zoom);font-size:10px}
.mk.cam{background:var(--t-cam);font-size:10px}
.mk.sel{box-shadow:0 0 0 2px var(--ink)}
.handle{position:absolute;top:0;bottom:0;width:10px;background:rgba(255,255,255,.35);cursor:ew-resize;touch-action:none}
.handle.l{left:0;border-radius:6px 0 0 6px} .handle.r{right:0;border-radius:0 6px 6px 0}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;z-index:3}
.playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top:8px solid var(--accent)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{padding:0;border:2px solid transparent;border-radius:9px;overflow:hidden;background:#000;cursor:pointer;aspect-ratio:9/16}
.thumb canvas{width:100%;height:100%;display:block}
.thumb[aria-pressed="true"]{border-color:var(--accent)}
.opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);cursor:pointer;font-size:13px;line-height:1.4}
.opt:has(input[type=radio]:checked){border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-soft)}
.opt input[type=radio]{accent-color:var(--accent);margin:0;flex:none}
.opt input[type=text]{padding:5px 8px;font-size:13px}
.emoji-pick{display:flex;flex-wrap:wrap;gap:4px}

<script>
"use strict";
/* ===== Dasar ===== */
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem("clipper." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("clipper." + k, JSON.stringify(v)); return true; } catch (e) { toast("Penyimpanan browser penuh. Hapus proyek lama."); return false; } }
};
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
function slug(s){ return String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "").slice(0, 40) || "klip"; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const video = $("src");
let srcOffset = 0, loadedFor = null;

function toast(msg, action){
  const box = $("toasts"); if (!box) return;
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement("button"); b.textContent = action.label; b.onclick = () => { action.run(); t.remove(); }; t.appendChild(b); }
  box.appendChild(t); setTimeout(() => t.remove(), action ? 7000 : 3800);
}
// Tombol hapus dua langkah: ketuk sekali untuk "Yakin?", ketuk lagi untuk hapus
function armDelete(btn, run){
  btn.onclick = e => {
    e.stopPropagation();
    if (btn.classList.contains("armed")) { run(); return; }
    btn.classList.add("armed"); const o = btn.innerHTML; btn.textContent = "Yakin hapus?";
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.innerHTML = o; } }, 3000);
  };
}
async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (_) {} ta.remove(); }
  if (btn) { const o = btn.textContent; btn.textContent = "Tersalin"; setTimeout(() => btn.textContent = o, 1300); }
}
function download(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
}

/* ===== Pengaturan ===== */
const DEFAULT_SETTINGS = { model: "gemini-2.5-flash", whisper: "small", quality: 720, voice: "Puck", thumbStyle: "kuning", theme: "auto", view: "auto" };
const DEFAULT_STYLE = { layout: "cover", follow: true, subs: true, title: true, zoom: true, emoji: true, bar: false, upper: true, intro: true, shift: 0 };
function settings(){ return Object.assign({}, DEFAULT_SETTINGS, store.get("settings", {})); }
function setSetting(k, v){ const s = store.get("settings", {}); s[k] = v; store.set("settings", s); }
function srv(){ return { url: String(store.get("srvUrl", "")).trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$|\/+$/g, ""), key: store.get("srvKey", "") }; }
function srvOk(){ const s = srv(); return /^[\w.-]+\/[\w.-]+$/.test(s.url) && !!s.key; }
function styleOf(p){ return Object.assign({}, DEFAULT_STYLE, (p && p.style) || {}); }
function renderOpts(p){ const s = settings(), st = styleOf(p); return Object.assign({}, st, { quality: +s.quality || 720, voice: s.voice }); }

/* ===== MESIN (teruji) ===== */
/* ---------- Util waktu ---------- */
function parseTime(v){
  if (typeof v === "number") return v;
  if (v == null) return NaN;
  const s = String(v).trim().replace(",", ".");
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  const p = s.split(":").map(parseFloat);
  if (p.some(isNaN)) return NaN;
  return p.reduce((a, x) => a * 60 + x, 0);
}
function fmt(t){
  t = Math.max(0, t || 0);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = Math.floor(t % 60);
  const mm = String(m).padStart(h ? 2 : 1, "0"), ss = String(s).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}
function ytId(url){
  const m = String(url).match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

/* ---------- Prompt Gemini ---------- */
const modeText = {
  pintar: "Tentukan sendiri jenis momen yang paling cocok untuk video ini (lucu, emosional, informatif, kontroversial, plot twist, atau quotable). Utamakan hook kuat di 3 detik pertama.",
  biasa: "Konten umum (podcast, vlog, edukasi, gaming). Cari momen dengan hook kuat, cerita lengkap, punchline, fakta mengejutkan, atau opini tajam.",
  quotes: "Konten quotes/motivasi. Cari kalimat bijak, nasihat, atau pernyataan yang sangat layak dikutip dan bisa berdiri sendiri tanpa konteks.",
  film: "Konten film/kartun (termasuk kartun anak). Cari adegan paling lucu, menegangkan, mengharukan, atau ikonik dengan alur adegan yang utuh."
};
function buildPrompt(o){
  const lang = o.subLang === "id"
    ? "Tulis subtitle dalam Bahasa Indonesia (terjemahkan bila video berbahasa lain), tetap ikuti waktu ucapan aslinya."
    : "Tulis subtitle persis dalam bahasa yang diucapkan di video (deteksi otomatis; bila campur, tulis apa adanya).";
  return `Kamu adalah editor video short-form profesional (TikTok, Reels, YouTube Shorts).
Tonton video YouTube ini dan pilih ${o.n} klip terbaik yang berpotensi viral.

ATURAN DURASI: setiap klip berdurasi antara ${o.min} sampai ${o.max} detik.
JENIS KONTEN: ${modeText[o.mode] || modeText.pintar}
${o.extra ? "CATATAN PENGGUNA: " + o.extra : ""}

ATURAN KLIP:
- Mulai tepat di awal kalimat/adegan, selesai saat pemikiran atau adegan tuntas. Jangan memotong di tengah kata.
- Klip tidak boleh saling tumpang tindih. Hindari intro, outro, iklan sponsor, dan ajakan subscribe.
- Semua waktu dalam DETIK sejak awal video (angka desimal, contoh 754.5).

UNTUK SETIAP KLIP BERIKAN:
- start, end: waktu dalam detik.
- title: judul hook pendek bahasa Indonesia, maksimal 7 kata, memancing rasa penasaran.
- caption: caption posting bahasa Indonesia 1–2 kalimat.
- hashtags: 4–6 hashtag relevan (tanpa spasi).
- viral_score: 0–100, jujur dan realistis.
- reason: 1 kalimat bahasa Indonesia, kenapa momen ini menarik.
- focus_x: posisi horizontal wajah/subjek utama di layar (0 = paling kiri, 0.5 = tengah, 1 = paling kanan).
- focus: jalur kamera yang mengikuti ORANG YANG SEDANG BERBICARA. Daftar {t: detik absolut, x: posisi horizontal wajah pembicara 0–1}. Titik pertama di awal klip, lalu tambah titik SETIAP KALI pembicara berganti atau pembicara berpindah posisi. Bila tidak ada yang bicara, arahkan ke wajah/subjek paling penting.
- subtitles: daftar potongan ucapan yang MENUTUPI SELURUH klip berurutan. Tiap potongan 1–5 kata (maks ±24 karakter), dengan s dan e (detik absolut) sedekat mungkin dengan saat kata diucapkan, t = teks, hl = 0–2 kata paling penting dari t (tulis persis sama). ${lang} Bila tidak ada ucapan (mis. adegan tanpa dialog), boleh kosong.
- hooks: 3 kalimat hook pembuka berbeda gaya (1: bikin penasaran, 2: kontroversial/berani, 3: emosional), bahasa Indonesia, maksimal 10 kata, enak diucapkan, JANGAN membocorkan inti cerita.
- thumb_times: 3 detik absolut DI DALAM klip dengan ekspresi wajah atau momen visual paling kuat untuk thumbnail.
- thumb_emoji: satu emoji yang paling mewakili klip.
- emojis: 2–5 emoji yang muncul di momen penting: {t: detik absolut, e: satu emoji}.
- zooms: 2–4 detik absolut untuk efek zoom (punchline, reaksi, kata kunci).

Balas HANYA JSON valid dengan bentuk:
{"video_title":"…","language":"id","clips":[{"start":0,"end":0,"title":"","caption":"","hashtags":[""],"viral_score":0,"reason":"","focus_x":0.5,"focus":[{"t":0,"x":0.5}],"subtitles":[{"s":0,"e":0,"t":"","hl":[""]}],"hooks":["","",""],"thumb_times":[0,0,0],"thumb_emoji":"😱","emojis":[{"t":0,"e":"🔥"}],"zooms":[0]}]}`;
}


function explainError(code, data){
  const msg = (data && data.error && data.error.message) || "";
  if (code === 400 && /API key/i.test(msg)) return "API key tidak valid. Periksa lagi di langkah 1.";
  if (code === 403) return "API key ditolak (403). Pastikan key aktif dan Gemini API sudah diaktifkan.";
  if (code === 404) return "Model tidak ditemukan. Ganti model di Pengaturan lanjutan.";
  if (code === 429) return "Kuota gratis Gemini habis untuk sementara. Tunggu sebentar atau coba model lain.";
  if (/private|unavailable|not.*access/i.test(msg)) return "Video tidak bisa diakses Gemini. Pastikan videonya publik (bukan privat/unlisted/dibatasi umur).";
  if (/token|too long|exceed/i.test(msg)) return "Video terlalu panjang untuk sekali analisis. Coba video yang lebih pendek (di bawah ±1 jam).";
  return `Gemini error ${code}: ${msg || "tidak diketahui"}`;
}
function normalize(clips, o){
  return clips.map(c => {
    let s = parseTime(c.start), e = parseTime(c.end);
    if (!isFinite(s) || !isFinite(e)) return null;
    if (e - s < o.min) e = s + o.min;
    if (e - s > o.max) e = s + o.max;
    return {
      start: s, end: e,
      title: String(c.title || "Klip").trim(),
      caption: String(c.caption || "").trim(),
      hashtags: (c.hashtags || []).map(h => "#" + String(h).replace(/^#/, "").replace(/\s+/g, "")).filter(h => h.length > 1),
      score: Math.max(0, Math.min(100, Math.round(+c.viral_score || 0))),
      reason: String(c.reason || ""),
      focus: isFinite(+c.focus_x) ? Math.max(0, Math.min(1, +c.focus_x)) : 0.5,
      track: (c.focus || []).map(p => ({ t: parseTime(p.t), x: Math.max(0, Math.min(1, +p.x)) }))
        .filter(p => isFinite(p.t) && isFinite(p.x)).sort((a, b) => a.t - b.t),
      adj: 0,
      hooks: (c.hooks || []).map(x => String(x || "").trim()).filter(Boolean).slice(0, 3),
      thumbT: (c.thumb_times || []).map(parseTime).filter(isFinite),
      thumbEmoji: String(c.thumb_emoji || "").trim(),
      subs: (c.subtitles || []).map(x => ({ s: parseTime(x.s), e: parseTime(x.e), t: String(x.t || "").trim(), hl: (x.hl || []).map(String) }))
        .filter(x => isFinite(x.s) && isFinite(x.e) && x.t).sort((a, b) => a.s - b.s),
      emojis: (c.emojis || []).map(x => ({ t: parseTime(x.t), e: String(x.e || "") })).filter(x => isFinite(x.t) && x.e),
      zooms: (c.zooms || []).map(parseTime).filter(isFinite),
      on: true, out: null, hookIdx: 0, thumbIdx: 0
    };
  }).filter(Boolean).map(c => {
    c.thumbT = c.thumbT.filter(t => t >= c.start && t <= c.end);
    if (!c.hooks.length) c.hooks = [c.title];
    return c;
  }).sort((a, b) => b.score - a.score);
}


async function gh(path, init, raw){
  const s = srv();
  if (!srvOk()) throw new Error("Isi repo dan token GitHub dulu (langkah 1 → Pengambil video).");
  let res;
  try {
    res = await fetch("https://api.github.com/repos/" + s.url + path, Object.assign({}, init, { headers: Object.assign({
      "Authorization": "Bearer " + s.key, "Accept": raw ? "application/vnd.github.raw" : "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28" }, init && init.headers) }));
  } catch (e) { throw new Error("Tidak bisa terhubung ke GitHub. Cek internet, lalu coba lagi."); }
  return res;
}
async function ghErr(res){
  let msg = ""; try { msg = (await res.json()).message || ""; } catch (e) {}
  if (res.status === 401) return "Token GitHub salah atau kedaluwarsa. Buat token baru.";

// Minta GitHub Actions mengambil & memotong beberapa klip sekaligus (satu tugas)
async function runGithubJob(need){
  const id = Math.floor(Date.now() / 1000) + "-" + Math.random().toString(36).slice(2, 8);
  const ref = await branch();
  say("Mengirim tugas ke GitHub…");
  const r = await gh("/actions/workflows/clip.yml/dispatches", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ref, inputs: {
      id, url: "https://www.youtube.com/watch?v=" + need[0].vid,
      clips: JSON.stringify(need.map(c => [+c.start.toFixed(2), +c.end.toFixed(2)])),
      height: String(settings().quality), whisper: settings().whisper || "small" } }) });
  if (!r.ok) throw new Error(await ghErr(r));
  const t0 = Date.now(); let status = null;
  for (;;) {
    await sleep(5000);
    say(`GitHub mengambil & memotong ${need.length} klip… ${Math.round((Date.now() - t0) / 1000)} dtk (biasanya 1–3 menit)`);
    const q = await gh(`/contents/status.json?ref=out-${id}`, null, true);
    if (q.ok) { status = await q.json(); break; }
    if (q.status !== 404) throw new Error(await ghErr(q));
    if (Date.now() - t0 > 20 * 60 * 1000) throw new Error("GitHub terlalu lama. Buka tab Actions di repo untuk melihat masalahnya.");
  }
  if (!status.ok && status.error) throw new Error(status.error);
  const out = [];
  for (let i = 0; i < need.length; i++) {
    const f = status.files && status.files[String(i)];
    if (!f) { out.push({ err: (status.errors && status.errors[String(i)]) || status.error || "Klip gagal diproses." }); continue; }
    say(`Mengunduh klip ${i + 1}/${need.length} ke HP…`);
    const d = await gh(`/contents/${f}?ref=out-${id}`, null, true);
    if (!d.ok) { out.push({ err: await ghErr(d) }); continue; }

/* ---------- Suara hook (Gemini TTS) ---------- */
const ttsCache = new Map();
async function ttsBuffer(text, voice){
  const key = voice + "|" + text;
  if (ttsCache.has(key)) return ttsCache.get(key);
  const apiKey = store.get("key", "");
  if (!apiKey) throw new Error("API key Gemini belum diisi.");
  ensureAudio();
  let lastErr = "";
  for (const model of ["gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"]) {
    let res;
    try {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: "Bacakan dengan nada bersemangat dan bikin penasaran, seperti pembuka video viral: " + text }] }],
          generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } } } })
      });
    } catch (e) { throw new Error("Tidak bisa terhubung ke Gemini untuk membuat suara."); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { lastErr = res.status === 429 ? "Kuota suara Gemini habis sementara. Coba lagi nanti." : ((data.error && data.error.message) || "error " + res.status); if (res.status === 404 || res.status === 400) continue; throw new Error(lastErr); }
    const part = (((data.candidates || [])[0] || {}).content || { parts: [] }).parts.find(p => p.inlineData);
    if (!part) { lastErr = "Gemini tidak mengirim suara."; continue; }
    const bin = atob(part.inlineData.data), n = bin.length >> 1;
    const rate = +((part.inlineData.mimeType || "").match(/rate=(\d+)/) || [0, 24000])[1];
    const buf = audioCtx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
    for (let j = 0; j < n; j++) { let v = bin.charCodeAt(2 * j) | (bin.charCodeAt(2 * j + 1) << 8); if (v >= 32768) v -= 65536; ch[j] = v / 32768; }
    ttsCache.set(key, buf);
    return buf;
  }
  throw new Error("Gagal membuat suara hook: " + lastErr);
}
async function playHook(c){
  ensureAudio(); await audioCtx.resume();
  const buf = await ttsBuffer(hookText(c), settings().voice);
  const s = audioCtx.createBufferSource(); s.buffer = buf; s.connect(audioCtx.destination); s.start();
  return new Promise(r => s.onended = r);
}

/* ---------- Render (canvas → MediaRecorder) ---------- */
let rendering = false, cancelFlag = false, audioCtx = null, audioDest = null, monitorGain = null, wakeLock = null;
function pickMime(){
  const list = ['video/mp4;codecs="avc1.42E01E,mp4a.40.2"', "video/mp4;codecs=avc1,mp4a", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  return list.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
function ensureAudio(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AC();
  const src = audioCtx.createMediaElementSource(video);
  audioDest = audioCtx.createMediaStreamDestination();
  src.connect(audioDest); // ke perekam
  monitorGain = audioCtx.createGain(); monitorGain.gain.value = 0;
  src.connect(monitorGain); monitorGain.connect(audioCtx.destination); // ke speaker hanya saat pratinjau
}
async function renderOne(c, o, intro, prog){
  prog = prog || (() => {});
  sizeCanvas(o.quality);
  await seek(c.start);
  const thumbCv = intro ? makeThumbCanvas(c, canvas.width, canvas.height) : null;
  if (thumbCv) ctx.drawImage(thumbCv, 0, 0); else drawFrame(c, c.start, o);
  const stream = canvas.captureStream(30);
  audioDest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
  const mime = pickMime();
  const rec = new MediaRecorder(stream, Object.assign({ videoBitsPerSecond: o.quality === 1080 ? 9e6 : 5e6, audioBitsPerSecond: 128000 }, mime ? { mimeType: mime } : {}));
  const chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => rec.onstop = r);
  const onVis = () => {
    if (document.hidden) { video.pause(); if (rec.state === "recording") rec.pause(); }
    else if (rec.state === "paused") { rec.resume(); video.play(); }
  };
  document.addEventListener("visibilitychange", onVis);
  rec.start(500);
  // Intro: thumbnail tampil sambil hook dibacakan, lalu video mulai
  if (thumbCv) {
    let dur = 2.2, src = null;
    if (intro.buf) { src = audioCtx.createBufferSource(); src.buffer = intro.buf; src.connect(audioDest); dur = intro.buf.duration + 0.5; }
    const t0 = performance.now();
    if (src) src.start();
    await new Promise(res => {
      const loop = () => {
        const el = (performance.now() - t0) / 1000, W = canvas.width, H = canvas.height;
        const z = 1 + 0.05 * Math.min(1, el / dur), pop = el < 0.25 ? 0.92 + 0.08 * backOut(el / 0.25) : 1;
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z * pop, z * pop); ctx.drawImage(thumbCv, -W / 2, -H / 2); ctx.restore();
        if (el > dur - 0.18) { ctx.fillStyle = `rgba(255,255,255,${Math.min(1, (el - dur + 0.18) / 0.18) * 0.6})`; ctx.fillRect(0, 0, W, H); }
        prog(`Intro hook ${el.toFixed(1)} / ${dur.toFixed(1)} dtk`, 0);
        if (el >= dur || cancelFlag) return res();
        requestAnimationFrame(loop);
      };
      requestAnimationFrame(loop);
    });
    try { src && src.stop(); } catch (e) {}
  }
  video.muted = false; video.volume = 1; video.playbackRate = 1;
  await video.play();
  await new Promise(resolve => {
    const loop = () => {
      const t = video.currentTime + srcOffset;
      drawFrame(c, t, o);
      const p = Math.min(1, (t - c.start) / (c.end - c.start));
      prog(`Merekam ${fmt(t - c.start)} / ${fmt(c.end - c.start)}${document.hidden ? " (dijeda, buka lagi halaman ini)" : ""}`, Math.max(0, p));
      if (t >= c.end - 0.04 || video.ended || cancelFlag) return resolve();
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
  video.pause();
  if (rec.state !== "inactive") rec.stop();
  await stopped;
  document.removeEventListener("visibilitychange", onVis);
  stream.getVideoTracks().forEach(tr => tr.stop());
  if (cancelFlag) return null;
  const type = (mime || "video/webm").split(";")[0];
  return new Blob(chunks, { type });
}

// Kelompokkan kata Whisper jadi potongan subtitle pendek yang enak dibaca
function wordsToCues(words){
  const cues = []; let cur = [];
  const flush = () => { if (cur.length) cues.push({ s: cur[0].s, e: cur[cur.length - 1].e, t: cur.map(w => w.w).join(" "), hl: [], w: cur.map(w => ({ s: w.s, e: w.e })) }); cur = []; };
  words.forEach((w, i) => {
    const prev = cur[cur.length - 1];
    const chars = cur.reduce((a, x) => a + x.w.length + 1, 0) + w.w.length;
    if (prev && (cur.length >= 4 || chars > 24 || w.s - prev.e > 0.45 || /[.?!,;:]$/.test(prev.w))) flush();
    cur.push(w);
  });
  flush();
  // tutup jeda kecil supaya teks tidak berkedip
  for (let i = 0; i < cues.length - 1; i++) if (cues[i + 1].s - cues[i].e < 0.3) cues[i].e = cues[i + 1].s;
  return cues;
}
// Tandai kata penting: pakai pilihan Gemini sebelumnya bila cocok, kalau tidak kata terpanjang
function markHighlights(cues, oldSubs){
  const want = new Set((oldSubs || []).flatMap(x => x.hl || []).map(h => h.toLowerCase().replace(/[^\p{L}\p{N}]/gu, "")));
  cues.forEach(c => {
    const ws = c.t.split(/\s+/).map(w => w.replace(/[^\p{L}\p{N}]/gu, ""));
    const hit = ws.filter(w => want.has(w.toLowerCase()));
    c.hl = hit.length ? hit.slice(0, 2) : [];
  });
}
async function geminiText(prompt){
  const key = store.get("key", ""); if (!key) throw new Error("API key Gemini belum diisi.");
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(settings().model || "gemini-2.5-flash")}:generateContent?key=${encodeURIComponent(key)}`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.3 } }) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(explainError(res.status, data));
  const text = ((((data.candidates || [])[0] || {}).content || {}).parts || []).filter(p => !p.thought && p.text).map(p => p.text).join("");
  return JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, ""));
}
// Terjemahkan per baris dengan konteks penuh; jumlah & urutan baris dijaga agar waktu tetap sinkron
async function translateCues(cues, fromLang){
  const lines = cues.map((c, i) => `${i + 1}. ${c.t}`).join("\n");
  const out = await geminiText(`Kamu penerjemah subtitle video pendek. Terjemahkan setiap baris berikut (bahasa sumber: ${fromLang || "deteksi otomatis"}) ke Bahasa Indonesia percakapan yang natural dan akurat sesuai konteks keseluruhan.
ATURAN: jumlah baris keluaran HARUS ${cues.length}, urutan sama, satu baris keluaran = terjemahan baris dengan nomor yang sama. Singkat (idealnya maks 5 kata). Jangan menambah informasi.
Untuk tiap baris, pilih 0–1 kata paling penting dari terjemahanmu sebagai "hl".
Balas JSON: {"lines":[{"t":"terjemahan","hl":["kata"]}]}

${lines}`);
  const arr = out && out.lines;
  if (!Array.isArray(arr) || arr.length !== cues.length) throw new Error("Terjemahan tidak lengkap");
  return cues.map((c, i) => ({ s: c.s, e: c.e, t: String(arr[i].t || c.t).trim(), hl: (arr[i].hl || []).map(String), tr: true }));
}

async function analyzeToProject(form, task){
  const key = store.get("key", "");
  if (!key) throw new Error("API key Gemini belum diisi. Buka Pengaturan.");
  const id = ytId(form.url);
  if (!id) throw new Error("Link YouTube tidak dikenali. Contoh: https://youtu.be/abc123XYZ00");
  if (form.min > form.max) throw new Error("Durasi minimum lebih besar dari maksimum.");
  const model = settings().model || "gemini-2.5-flash";
  const t0 = Date.now();
  const tick = setInterval(() => updTask(task, `Gemini menonton video… ${Math.round((Date.now() - t0) / 1000)} dtk`, Math.min(0.9, (Date.now() - t0) / 120000)), 1000);
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
  const body = lowRes => JSON.stringify({
    contents: [{ role: "user", parts: [{ fileData: { fileUri: "https://www.youtube.com/watch?v=" + id } }, { text: buildPrompt(form) }] }],
    generationConfig: Object.assign({ responseMimeType: "application/json", temperature: 0.7 }, lowRes ? { mediaResolution: "MEDIA_RESOLUTION_LOW" } : {})
  });
  try {
    let res;
    try {
      res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body(true) });
      if (res.status === 400) { const peek = await res.clone().text(); if (/mediaResolution|media_resolution/i.test(peek)) res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: body(false) }); }
    } catch (e) { throw new Error("Tidak bisa terhubung ke Gemini. Cek internet, lalu coba lagi."); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(explainError(res.status, data));
    const cand = data.candidates && data.candidates[0];
    if (!cand || !cand.content) throw new Error(cand && cand.finishReason ? `Gemini berhenti (${cand.finishReason}). Coba lagi atau kurangi jumlah klip.` : "Gemini tidak mengirim jawaban. Coba lagi.");
    const text = cand.content.parts.filter(p => !p.thought && p.text).map(p => p.text).join("");
    let json;
    try { json = JSON.parse(text.replace(/^```(?:json)?\s*|\s*```$/g, "")); } catch (e) { throw new Error("Jawaban Gemini terpotong. Coba lagi."); }
    const clips = normalize(json.clips || [], form);
    if (!clips.length) throw new Error("Gemini tidak menemukan klip yang cocok. Coba ubah durasi atau jenis konten.");
    const p = { id: uid(), vid: id, title: json.video_title || "Video YouTube", created: Date.now(), mode: form.mode, style: {}, clips: [] };
    clips.forEach(c => { c.id = uid(); c.vid = id; c.subLang = form.subLang; ensureThumb(c); p.clips.push(c); });
    projects.unshift(p); saveProjects();
    return p;
  } finally { clearInterval(tick); }
}

  return { name: ["home", "new", "projects", "exports", "settings"].includes(h[0]) ? h[0] : "home" };
}

function rerender(){
  if (route.name === "edit" && typeof leaveEditor === "function") leaveEditor();
  route = parseRoute();

  document.querySelectorAll("#nav a, #tabbar a").forEach(a => a.setAttribute("aria-current", a.dataset.r === navKey ? "page" : "false"));

let renderChain = Promise.resolve(), renderingClip = null;
function exportClips(p, list){
  if (!list.length) return;
  if (!srvOk()) { toast("Isi repo & token GitHub dulu di Pengaturan."); return; }
  if (!window.MediaRecorder || !canvas.captureStream) { toast("Browser ini belum bisa merekam video. Pakai Chrome terbaru."); return; }
  fetchTask(p, list); // ambil semua video sekaligus
  for (const c of list) {
    const t = addTask("Ekspor · " + c.title, "render");
    let cancelled = false;
    t.cancel = () => { cancelled = true; cancelFlag = true; updTask(t, "Membatalkan…"); };
    renderChain = renderChain.then(() => cancelled ? endTask(t, false, "Dibatalkan") : exportOne(p, c, t)).catch(() => {});
  }
  toast(list.length > 1 ? `${list.length} klip masuk antrian ekspor` : "Klip masuk antrian ekspor");
}
async function exportOne(p, c, t){
  const o = renderOpts(p);
  cancelFlag = false;
  try {
    updTask(t, "Menunggu video dari GitHub…", 0.02);
    await loadClipSource(c, m => updTask(t, m));

  }
  if (ed.tab === "hook") {
    pane.innerHTML = `<div class="sect">${sw("stIntro", "Intro thumbnail + hook bersuara", st.intro, "Video dibuka dengan thumbnail sambil hook dibacakan")}</div>
      <div class="sect"><h4>Thumbnail</h4><div class="thumbs" id="edThumbs">${[0, 1, 2].map(k => `<button type="button" class="thumb" data-k="${k}" aria-label="Thumbnail ${k + 1}"><canvas width="180" height="320"></canvas></button>`).join("")}</div>
        <div class="chips">${THUMB_STYLES.map(([v2, n]) => `<label class="chip"><input type="radio" name="edSt" value="${v2}" ${c.thumbStyle === v2 ? "checked" : ""}><span>${n}</span></label>`).join("")}</div>
        <div class="chips"><button class="btn sec sm" id="hkFrames">${c.frames ? "Ambil ulang frame" : "Ambil frame dari video"}</button><button class="btn sec sm" id="hkDl">Unduh thumbnail</button></div></div>
      <div class="sect"><h4>Hook pembuka</h4>
        ${c.hooks.map((h, k) => `<label class="opt"><input type="radio" name="edHk" value="${k}" ${c.hookIdx === k ? "checked" : ""}><span>${esc(h)}</span></label>`).join("")}
        <label class="opt"><input type="radio" name="edHk" value="-1" ${c.hookIdx === -1 ? "checked" : ""}><input type="text" id="hkCustom" placeholder="Tulis hook sendiri…" value="${esc(c.hookCustom || "")}"></label>
        <div class="chips"><button class="btn sec sm" id="hkListen">Dengar hook</button>
          <select id="hkVoice" style="width:auto">${[["Puck", "Puck · pria ceria"], ["Fenrir", "Fenrir · pria semangat"], ["Charon", "Charon · pria tenang"], ["Kore", "Kore · wanita tegas"], ["Aoede", "Aoede · wanita ringan"], ["Zephyr", "Zephyr · wanita cerah"]].map(([a, b]) => `<option value="${a}" ${settings().voice === a ? "selected" : ""}>${b}</option>`).join("")}</select></div></div>`;
    bindStyle("stIntro", "intro");
    const tb = $("edThumbs"); paintThumbs(c, tb);
    tb.querySelectorAll(".thumb").forEach(b => b.onclick = () => { c.thumbIdx = +b.dataset.k; saveProjects(); paintThumbs(c, tb); edDrawStatic(); });
    pane.querySelectorAll("input[name=edSt]").forEach(r => r.onchange = () => { c.thumbStyle = r.value; saveProjects(); paintThumbs(c, tb); });
    pane.querySelectorAll("input[name=edHk]").forEach(r => r.onchange = () => { c.hookIdx = +r.value; saveProjects(); paintThumbs(c, tb); });
    $("hkCustom").oninput = e => { c.hookCustom = e.target.value; c.hookIdx = -1; pane.querySelector('input[name=edHk][value="-1"]').checked = true; saveProjects(); paintThumbs(c, tb); };
    $("hkVoice").onchange = e => setSetting("voice", e.target.value);
    $("hkFrames").onclick = async e => { const b = e.target; if (!segCovers(c)) { toast("Ambil video klip ini dulu."); return; } b.disabled = true; b.textContent = "Mengambil…";
      try { edPause(); await captureFrames(c); paintThumbs(c, tb); b.textContent = "Ambil ulang frame"; edSeek(ed.t); } catch (er) { toast(er.message); b.textContent = "Ambil frame dari video"; } b.disabled = false; };
    $("hkDl").onclick = async e => { if (!c.frames && !segCovers(c)) { toast("Ambil video klip ini dulu."); return; } const b = e.target; b.disabled = true;
      try { edPause(); const blob = await thumbBlob(c); paintThumbs(c, tb); download(blob, `thumbnail-${slug(c.title)}.png`); edSeek(ed.t); } catch (er) { toast(er.message); } b.disabled = false; };
    $("hkListen").onclick = async e => { const b = e.target, o = b.textContent; b.textContent = "Membuat suara…"; b.disabled = true;
      try { await playHook(c); } catch (er) { toast(er.message); } b.textContent = o; b.disabled = false; };
  }
  if (ed.tab === "efek") {
    pane.innerHTML = `<div class="sect"><h4>Tata letak</h4><div class="chips">
        ${[["cover", "Penuh 9:16"], ["blur", "Utuh + latar blur"]].map(([a, b]) => `<label class="chip"><input type="radio" name="edLay" value="${a}" ${st.layout === a ? "checked" : ""}><span>${b}</span></label>`).join("")}</div></div>
      <div class="sect"><h4>Efek</h4>${sw("stZoom", "Zoom & gerak kamera", st.zoom)}${sw("stEmoji", "Emoji muncul", st.emoji)}${sw("stBar", "Garis progres bawah", st.bar)}</div>
      <div class="sect"><h4>Tambah emoji di playhead</h4><div class="emoji-pick">${EMOJIS.map(e => `<button type="button" data-em="${e}">${e}</button>`).join("")}</div>
        ${c.emojis.map((x, i) => `<div class="list-row"><span class="mono" data-go="${x.t}">${fmtS(x.t - c.start)}</span><span class="grow">${x.e}</span><button class="btn ghost sm icon" data-rme="${i}" aria-label="Hapus">✕</button></div>`).join("")}</div>
      <div class="sect"><h4>Titik zoom (${c.zooms.length})</h4>
        ${c.zooms.map((t, i) => `<div class="list-row"><span class="mono" data-go="${t}">${fmtS(t - c.start)}</span><span class="grow">Zoom cepat</span><button class="btn ghost sm icon" data-rmz="${i}" aria-label="Hapus">✕</button></div>`).join("") || `<p class="hint">Tekan “+ Zoom” di timeline untuk menambah.</p>`}</div>${projNote}`;
    pane.querySelectorAll("input[name=edLay]").forEach(r => r.onchange = () => { ed.p.style = Object.assign(styleOf(ed.p), { layout: r.value }); changed(true); });
    bindStyle("stZoom", "zoom"); bindStyle("stEmoji", "emoji"); bindStyle("stBar", "bar");
    pane.querySelectorAll("[data-em]").forEach(b => b.onclick = () => { c.emojis.push({ t: ed.t, e: b.dataset.em }); c.emojis.sort((a, b2) => a.t - b2.t); changed(true); drawPane(); });
    pane.querySelectorAll("[data-rme]").forEach(b => b.onclick = () => { c.emojis.splice(+b.dataset.rme, 1); changed(true); drawPane(); });
    pane.querySelectorAll("[data-rmz]").forEach(b => b.onclick = () => { c.zooms.splice(+b.dataset.rmz, 1); changed(true); drawPane(); });
    pane.querySelectorAll("[data-go]").forEach(s => s.onclick = () => edSeek(+s.dataset.go));
  }
  if (ed.tab === "kamera") {
    const tr = c.track || (c.track = []);
    pane.innerHTML = `<div class="sect">${sw("stFollow", "Kamera ikut pembicara", st.follow, "Bingkai bergeser halus ke orang yang sedang bicara")}
        <div class="field"><label class="lbl" for="cAdj">Koreksi fokus seluruh klip</label><div class="range"><input type="range" id="cAdj" min="-0.3" max="0.3" step="0.01" value="${c.adj || 0}"><output id="cAdjO">${Math.round((c.adj || 0) * 100)}%</output></div></div></div>
      <div class="sect"><h4>Titik kamera (${tr.length})</h4>
        ${tr.map((p, i) => `<div class="list-row${ed.sel && ed.sel.k === "cam" && ed.sel.i === i ? " sel" : ""}"><span class="mono" data-go="${p.t}">${fmtS(p.t - c.start)}</span>
          <input type="range" min="0" max="1" step="0.01" value="${p.x}" data-cx="${i}" class="grow" aria-label="Posisi kamera ${i + 1}"><button class="btn ghost sm icon" data-rmc="${i}" aria-label="Hapus">✕</button></div>`).join("") || `<p class="hint">Belum ada. Tekan “+ Titik kamera” di timeline.</p>`}
        <p class="hint">Geser slider titik untuk mengarahkan kamera ke kiri atau kanan mulai detik itu.</p>
        ${c.trackSource === "wajah" ? `<span class="pill ok">Dari deteksi wajah & mulut yang bicara</span>` : `<span class="pill warn">Perkiraan AI · kurang akurat</span>`}</div>${projNote}`;
    bindStyle("stFollow", "follow");
    $("cAdj").oninput = e => { c.adj = +e.target.value; $("cAdjO").textContent = Math.round(c.adj * 100) + "%"; changed(false); };
    pane.querySelectorAll("[data-cx]").forEach(r => r.oninput = () => { tr[+r.dataset.cx].x = +r.value; edSeek(Math.max(ed.t, tr[+r.dataset.cx].t + 0.6)); changed(false); });
    pane.querySelectorAll("[data-rmc]").forEach(b => b.onclick = () => { tr.splice(+b.dataset.rmc, 1); changed(true); drawPane(); });
    pane.querySelectorAll("[data-go]").forEach(s => s.onclick = () => edSeek(+s.dataset.go));
  }
  if (ed.tab === "info") {
    pane.innerHTML = `<div class="sect"><h4>Skor viral</h4><div style="display:flex;gap:12px;align-items:center"><div class="score ${scoreCls(c.score)}">${c.score}<small>SKOR</small></div><p class="hint" style="flex:1">${esc(c.reason)}</p></div></div>
      <div class="sect"><h4>Waktu di video asli</h4><div class="grid2">
        <div class="field"><label class="lbl" for="cS">Mulai</label><input class="mono" id="cS" value="${fmtS(c.start)}"></div>
        <div class="field"><label class="lbl" for="cE">Selesai</label><input class="mono" id="cE" value="${fmtS(c.end)}"></div></div>
        <p class="hint">Memperpanjang di luar video yang sudah diambil akan mengambil ulang video saat ekspor.</p>
        <a class="btn sec sm" href="https://youtu.be/${c.vid}?t=${Math.floor(c.start)}" target="_blank" rel="noopener">Lihat di YouTube</a></div>
      <div class="sect"><h4>Caption posting</h4><textarea id="cCap" rows="3">${esc(c.caption || "")}</textarea>
        <input type="text" id="cTags" value="${esc((c.hashtags || []).join(" "))}" placeholder="#hashtag">
        <button class="btn sec sm" id="cCopy">Salin judul + caption + hashtag</button></div>`;
    $("cS").onchange = e => { const v2 = parseTime(e.target.value.replace(/^(\d+):(\d+\.?\d*)$/, "$1:$2")); if (isFinite(v2) && v2 < c.end - 3) { c.start = v2; changed(true); drawOverlay(); } };
    $("cE").onchange = e => { const v2 = parseTime(e.target.value); if (isFinite(v2) && v2 > c.start + 3) { c.end = v2; changed(true); drawOverlay(); } };
    $("cCap").oninput = e => { c.caption = e.target.value; saveProjects(); };
    $("cTags").oninput = e => { c.hashtags = e.target.value.split(/\s+/).filter(Boolean).map(h => "#" + h.replace(/^#/, "")); saveProjects(); };
    $("cCopy").onclick = e => copyText(captionText(c), e.target);
  }
}


/* ===== Mulai ===== */
window.addEventListener("beforeunload", e => { if (tasks.some(t => t.status === "run")) { e.preventDefault(); e.returnValue = ""; } });
applyTheme(); applyView(); updateCounts(); refreshExportCount();
rerender();
try { document.fonts && document.fonts.load('80px "Anton"').then(() => { if (route.name === "project" || route.name === "edit") rerender(); }); } catch (e) {}

</script>
</body>
</html>
